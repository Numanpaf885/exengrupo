name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish GitHub Releases on main
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Same key on every build => each new APK installs over the old one.
      # Needs the 4 ANDROID_* repository secrets (see CLAUDE.md / PR description).
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore from repository secrets."
          else
            echo "suffix=-debugkey" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned release::ANDROID_KEYSTORE_BASE64 is not set. This APK is signed with the shared debug key. Add the ANDROID_* secrets so updates install over each other with your own key."
          fi

      - name: Expo prebuild (Android)
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild -p android --no-install --clean

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: exengrupo-${{ github.run_number }}${{ steps.signing.outputs.suffix }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Every successful build on main becomes a GitHub Release with the APK
      # attached, so the newest app is always at:
      # https://github.com/<owner>/<repo>/releases/latest/download/exengrupo.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          KEY_SUFFIX: ${{ steps.signing.outputs.suffix }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/exengrupo.apk"
          if [ -n "$KEY_SUFFIX" ]; then
            KEY_NOTE="Signed with the shared debug key (ANDROID_* secrets not set). Uninstall it before installing a build signed with your own key."
          else
            KEY_NOTE="Signed with the exengrupo release key: installs over the previous version."
          fi
          gh release create "build-$RUN_NUMBER" "$RUNNER_TEMP/exengrupo.apk" \
            --target "$GITHUB_SHA" \
            --title "exengrupo build $RUN_NUMBER" \
            --notes "$KEY_NOTE" \
            --generate-notes \
            --latest
